<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Black canvas background -->
  <rect width="64" height="64" fill="#000000" rx="12"/>
  <!-- Hairline precision border -->
  <rect x="2" y="2" width="60" height="60" rx="10" stroke="#222222" stroke-width="1"/>
  <!-- Precision aperture circle (Q body) -->
  <circle cx="30" cy="30" r="16" stroke="#ffffff" stroke-width="3.5"/>
  <!-- Fluorescent yellow active signal tangent (Q tail) -->
  <line x1="38" y1="38" x2="52" y2="52" stroke="#d4ff00" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Inner focus node -->
  <circle cx="30" cy="30" r="4" fill="#d4ff00"/>
</svg>
