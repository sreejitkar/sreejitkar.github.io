<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" fill="none">
  <style>
    .fav-bracket { stroke: #18181b; stroke-opacity: 0.65; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .fav-wire { stroke: #18181b; stroke-width: 2.2; stroke-linejoin: round; }
    .fav-blade { fill: #0d5c46; stroke: #18181b; stroke-width: 2.2; stroke-linejoin: round; }
    .fav-slit { stroke: #ffffff; stroke-width: 2; stroke-linecap: round; }
    .fav-top { fill: #ffffff; fill-opacity: 0.9; }
    .fav-right { fill: #000000; fill-opacity: 0.06; }

    @media (prefers-color-scheme: dark) {
      .fav-bracket { stroke: #6272a4; stroke-opacity: 0.95; }
      .fav-wire { stroke: #f8f8f2; }
      .fav-blade { fill: #50fa7b; stroke: #f8f8f2; }
      .fav-slit { stroke: #000000; }
      .fav-top { fill: #ffffff; fill-opacity: 0.12; }
      .fav-right { fill: #ffffff; fill-opacity: 0.04; }
    }
  </style>

  <!-- Viewfinder Telemetry Brackets (Observability) -->
  <path class="fav-bracket" d="M 9 17 L 9 9 L 17 9"/>
  <path class="fav-bracket" d="M 39 9 L 47 9 L 47 17"/>
  <path class="fav-bracket" d="M 9 39 L 9 47 L 17 47"/>
  <path class="fav-bracket" d="M 39 47 L 47 47 L 47 39"/>

  <!-- Isometric Systems Cube -->
  <!-- Left Face: Server Blade -->
  <polygon class="fav-blade" points="18.5,21 28,26.5 28,37.5 18.5,32"/>
  <!-- Top Face -->
  <polygon class="fav-wire fav-top" points="28,15.5 37.5,21 28,26.5 18.5,21"/>
  <!-- Right Face -->
  <polygon class="fav-wire fav-right" points="28,26.5 37.5,21 37.5,32 28,37.5"/>
  <!-- Server Blade Slit Indicator -->
  <line class="fav-slit" x1="21.5" y1="25" x2="21.5" y2="29.5"/>
</svg>
