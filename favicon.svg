<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36">
  <defs>
    <linearGradient id="fav-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="fav-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .mark-bg { fill: #000000; fill-opacity: 0.08; stroke: #10b981; stroke-opacity: 0.4; }
    .mark-fg { fill: #111827; }
    @media (prefers-color-scheme: dark) {
      .mark-bg { fill: #ffffff; fill-opacity: 0.1; stroke: #10b981; stroke-opacity: 0.5; }
      .mark-fg { fill: #f9fafb; }
    }
  </style>
  <rect width="36" height="36" rx="9" class="mark-bg" stroke-width="1.2"/>
  <text x="18" y="19.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Geist', 'Inter', sans-serif" font-weight="800" font-size="10.5" letter-spacing="-0.02em" class="mark-fg">SKAR</text>
  <line x1="8.5" y1="24.5" x2="27.5" y2="24.5" stroke="url(#fav-laser)" stroke-width="2" stroke-linecap="round" filter="url(#fav-glow)"/>
</svg>
