<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36">
  <defs>
    <linearGradient id="fav-orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="fav-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .mark-bg { fill: #000000; fill-opacity: 0.08; stroke: #10b981; stroke-opacity: 0.35; }
    @media (prefers-color-scheme: dark) {
      .mark-bg { fill: #ffffff; fill-opacity: 0.08; stroke: #10b981; stroke-opacity: 0.5; }
    }
  </style>
  <rect width="36" height="36" rx="9" class="mark-bg" stroke-width="1.2"/>
  <path d="M 18 7 A 11 11 0 0 1 29 18" stroke="url(#fav-orbit-grad)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 7 18 A 11 11 0 0 1 15 7.5" stroke="url(#fav-orbit-grad)" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="18" cy="7" r="2.4" fill="#10b981" filter="url(#fav-glow)"/>
  <circle cx="27.5" cy="23.5" r="2" fill="#00f0ff" filter="url(#fav-glow)"/>
  <circle cx="18" cy="18" r="3.5" fill="url(#fav-orbit-grad)" filter="url(#fav-glow)"/>
  <circle cx="18" cy="18" r="1.5" fill="#ffffff"/>
</svg>
