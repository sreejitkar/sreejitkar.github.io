name: Sync Goodreads Bookshelf

on:
  schedule:
    - cron: '0 4 * * *'  # Runs daily at 04:00 UTC
  workflow_dispatch:      # Allows manual one-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync Goodreads Bookshelf
        run: python3 scripts/sync_books.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bookshelf.html
          if git diff --staged --quiet; then
            echo "No bookshelf updates detected."
          else
            git commit -m "Auto-sync bookshelf from Goodreads RSS [skip ci]"
            git push
          fi
